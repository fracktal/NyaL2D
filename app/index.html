<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NyaL2D</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/ui/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span>NyaL2D</div>
        <span class="divider-v"></span>
        <button id="load-sample" class="btn model-btn" type="button" data-icon="open" title="모델 고르기 · 가져오기 (Import)">모델<span class="caret" data-icon="chevronDown" aria-hidden="true"></span></button>
        <button id="settings" class="btn model-btn" type="button" data-icon="settings" title="설정 (Ctrl+,)">설정<span class="caret" data-icon="chevronDown" aria-hidden="true"></span></button>
        <!-- Kept for scripts and tests; files are imported from the model dialog. -->
        <input id="file-input" type="file" accept=".iki,.json,application/json" multiple class="sr-only" tabindex="-1" aria-hidden="true" />
        <div class="doc">
          <span id="model-name" class="doc-name muted">모델 없음</span>
          <span id="model-badge" class="badge hide-md" hidden></span>
          <span id="runtime-badge" class="badge hide-md" title="현재 런타임 · 설정에서 변경"></span>
        </div>
        <span class="spacer"></span>
        <div class="segmented" role="group" aria-label="모션 모드" id="motion-mode">
          <button type="button" data-mode="idle" aria-pressed="true" title="깜빡임·호흡·시선·머리 흔들림 + 물리">
            <span class="dot"></span>Idle
          </button>
          <button type="button" data-mode="physics" aria-pressed="false" title="물리만. 머리는 직접 움직입니다">
            <span class="dot"></span>물리만
          </button>
          <button type="button" data-mode="off" aria-pressed="false" title="모든 모션 정지">
            <span class="dot"></span>정지
          </button>
        </div>
        <span class="divider-v"></span>
        <button id="capture" class="btn icon" type="button" data-icon="camera" title="현재 프레임을 PNG로 저장" aria-label="프레임 캡처"></button>
        <button id="export" class="btn primary" type="button" data-icon="download">내보내기</button>
      </header>

      <aside class="panel panel-left" aria-label="파라미터">
        <div class="panel-head">
          <span class="panel-title">Parameters</span>
          <span id="param-count" class="panel-count"></span>
          <span class="spacer"></span>
          <button id="reset-pose" class="btn ghost sm icon" type="button" data-icon="reset" title="모든 파라미터를 기본값으로" aria-label="포즈 초기화"></button>
        </div>
        <div class="search" id="param-search-wrap">
          <input id="param-search" type="search" placeholder="파라미터 검색" aria-label="파라미터 검색" />
        </div>
        <div id="params" class="panel-body"></div>
      </aside>

      <main class="stage" id="stage">
        <div class="stage-hud">
          <span class="hud-chip" id="hud-status"><span class="pulse"></span><span>준비</span></span>
          <span class="spacer"></span>
          <span class="hud-chip mono hide-md" id="hud-size"></span>
        </div>
        <div class="stage-overlay" id="overlay"><div class="overlay-card" id="overlay-card"></div></div>
      </main>

      <aside class="panel panel-right" aria-label="인스펙터와 에이전트">
        <div class="panel-switch" role="tablist" aria-label="오른쪽 패널" id="panel-switch">
          <button type="button" role="tab" data-view="inspector" aria-selected="true" aria-controls="view-inspector">인스펙터</button>
          <button type="button" role="tab" data-view="agent" aria-selected="false" aria-controls="view-agent" title="에이전트 (Ctrl+J)">
            <span class="ai-mark" aria-hidden="true"></span>에이전트
          </button>
        </div>
        <div id="view-inspector" class="view" role="tabpanel">
          <div class="tabs" role="tablist" id="inspector-tabs"></div>
          <div id="inspector" class="panel-body"></div>
        </div>
        <div id="view-agent" class="view agent" role="tabpanel" hidden></div>
      </aside>

      <footer class="timeline" aria-label="변경 기록">
        <span class="timeline-label" data-icon="history">Changes</span>
        <div class="track" id="changes"></div>
        <div class="timeline-actions">
          <button id="undo" class="btn sm" type="button" data-icon="undo" title="실행 취소 (Ctrl+Z)">Undo</button>
          <button id="redo" class="btn sm" type="button" data-icon="redo" title="다시 실행 (Ctrl+Shift+Z)">Redo</button>
          <button id="revert" class="btn ghost sm" type="button" data-icon="reset" title="모든 변경을 버리고 원본으로">원본으로</button>
        </div>
      </footer>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
